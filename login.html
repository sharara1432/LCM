<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechBright LMS Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="container">

        <!-- Radio Buttons -->
        <input type="radio" name="tab" id="login" checked>
        <input type="radio" name="tab" id="register">

        <!-- Left Side -->
        <div class="left">

            <!-- Logo -->
            <div class="logo">
                <span class="dot"></span>
                <h2>TechBright LMS</h2>
            </div>

            <!-- Login/Register Tabs -->
            <div class="tabs">
                <label for="login">Sign In</label>
                <label for="register">Register</label>
            </div>

            <!-- Forms -->
            <div class="forms">

                <div class="slider">

                    <!-- ================= LOGIN ================= -->

                    <form class="form login-form" action="index.html" method="get">

                        <h1>Welcome Back</h1>

                        <p>Please login to your account</p>

                        <input type="text" name="username" placeholder="Username" required>

                        <input type="password" name="password" placeholder="Password" required>

                        <div class="row">

                            <label class="remember">
                                <input type="checkbox">
                                Remember Me
                            </label>

                            <a href="#">Forgot Password?</a>

                        </div>

                        <button type="submit">
                            Sign In
                        </button>

                    </form>

                    <!-- ================= REGISTER ================= -->

                    <form class="form register-form" action="#" method="post">

                        <h1>Create Account</h1>

                        <input type="text" name="fullname" placeholder="Full Name" required>

                        <input type="email" name="email" placeholder="Email Address" required>

                        <input type="text" name="username" placeholder="Username" required>

                        <input type="password" name="password" placeholder="Password" required>

                        <input type="password" name="confirm" placeholder="Confirm Password" required>

                        <label class="remember">

                            <input type="checkbox" required>

                            I agree to the Terms & Conditions

                        </label>

                        <button type="submit">
                            Register
                        </button>

                    </form>

                </div>

            </div>

        </div>

        <!-- Right Side -->

        <div class="right">

            <div class="purple-shape"></div>

            <img src="Images/wlc.jpg" alt="Laptop Illustration">

        </div>

    </div>

</body>
<script>
    document.querySelectorAll('.menu-header').forEach(menu => {

        menu.addEventListener('click', () => {

            const parent = menu.parentElement;

            parent.classList.toggle('active')

        });

    });
</script>

</html>
